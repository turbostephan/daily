<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Omega Daily — Starting Grid</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.ui.porsche.com" crossorigin>
<style>
  /* =========================================================
     Porsche Next — served from the official PDS CDN.
     Falls back cleanly to the system font when offline.
     ========================================================= */
  @font-face{
    font-family:'Porsche Next';font-style:normal;font-weight:var(--p-font-weight-normal);font-display:swap;
    src:url('https://cdn.ui.porsche.com/porsche-design-system/fonts/porsche-next-latin-regular.b8f1c20.woff2') format('woff2');
  }
  @font-face{
    font-family:'Porsche Next';font-style:normal;font-weight:var(--p-font-weight-semibold);font-display:swap;
    src:url('https://cdn.ui.porsche.com/porsche-design-system/fonts/porsche-next-latin-semi-bold.b5f6fca.woff2') format('woff2');
  }

  /* =========================================================
     Porsche Design System v4 — variables mirrored verbatim from
     designsystem.porsche.com/v4/stylesheets/css-variables.
     color-scheme:light pins every light-dark() token to its light value.
     ========================================================= */
  :root{
    color-scheme:light;
    --p-color-canvas: light-dark(#fff, hsl(225 66.7% 1.2%));
    --p-color-surface: light-dark(hsl(240 10% 95%), hsl(240 2% 10%));
    --p-color-frosted: light-dark(hsl(240 5% 70% / .148), hsl(240 2% 43% / .228));
    --p-color-frosted-soft: light-dark(hsl(234 9.8% 60% / .06), hsl(240 3.7% 26.5% / .154));
    --p-color-frosted-strong: light-dark(hsl(236 6.5% 42% / .236), hsl(240 1.5% 61.8% / .302));
    --p-color-backdrop: light-dark(hsl(240 5.3% 14.9% / .5), hsl(240 5.3% 14.9% / .5));
    --p-color-primary: light-dark(hsl(225 66.7% 1.2%), hsl(225 100% 99%));
    --p-color-contrast-higher: light-dark(hsl(240 8.7% 9% / .8), hsl(240 12.5% 96.9% / .78));
    --p-color-contrast-high: light-dark(hsl(240 7.1% 11% / .7), hsl(240 12.5% 96.9% / .67));
    --p-color-contrast-medium: light-dark(hsl(240 6.1% 7% / .6), hsl(240 12.5% 96.9% / .56));
    --p-color-contrast-low: light-dark(hsl(240 5.3% 14.9% / .5), hsl(240 12.5% 96.9% / .45));
    --p-color-contrast-lower: light-dark(hsl(234 6% 32.9% / .324), hsl(240 1.5% 61.8% / .302));
    --p-color-success: light-dark(hsl(115 77.5% 27.8%), hsl(157 84.9% 41.6%));
    --p-color-error: light-dark(hsl(357 78% 41%), hsl(0 96.9% 62%));
    --p-color-focus: light-dark(#1a44ea, #1a44ea);
    --p-font-porsche-next: "Porsche Next", "Arial Narrow", Arial, "Heiti SC", SimHei, sans-serif;
    --p-font-sans: var(--p-font-porsche-next);
    --p-font-weight-normal: 400;
    --p-font-weight-semibold: 600;
    --p-leading-normal: calc(6px + 2.125ex);
    --p-typescale-2xs: .75rem;
    --p-typescale-xs: .875rem;
    --p-typescale-sm: 1rem;
    --p-typescale-md: clamp(1.13rem, .21vw + 1.08rem, 1.33rem);
    --p-typescale-lg: clamp(1.27rem, .51vw + 1.16rem, 1.78rem);
    --p-typescale-xl: clamp(1.42rem, .94vw + 1.23rem, 2.37rem);
    --p-typescale-3xl: clamp(1.8rem, 2.41vw + 1.32rem, 4.21rem);
    --p-spacing-fluid-sm: clamp(8px, .5vw + 6px, 16px);
    --p-spacing-fluid-md: clamp(16px, 1.25vw + 12px, 36px);
    --p-spacing-fluid-lg: clamp(32px, 2.75vw + 23px, 76px);
    --p-spacing-static-xs: 4px;
    --p-spacing-static-sm: 8px;
    --p-spacing-static-md: 16px;
    --p-spacing-static-lg: 32px;
    --p-radius-sm: 4px;
    --p-radius-lg: 8px;
    --p-radius-4xl: 32px;
    --p-radius-full: calc(infinity * 1px);
    --p-blur-frosted: blur(32px);
    --p-shadow-md: 0px 4px 16px rgba(0, 0, 0, .16);
    --p-shadow-lg: 0px 8px 40px rgba(0, 0, 0, .16);
    --p-duration-sm: .25s;
    --p-duration-md: .4s;
    --p-duration-lg: .6s;
    --p-ease-in-out: cubic-bezier(.25, .1, .25, 1);

    /* --- additions beyond the design system, kept separate on purpose --- */
    --glass:        hsl(0 0% 100% / .46);
    --glass-opaque: hsl(0 0% 100% / .84);
    --glass-blur:   var(--p-blur-frosted) saturate(180%) brightness(1.04);
    --led-off:      hsl(240 6% 80%);
    --ease-spring:  cubic-bezier(.22, 1, .36, 1);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:#e8e9ec}
  body{
    font-family:var(--p-font-sans);font-size:var(--p-typescale-sm);line-height:var(--p-leading-normal);
    background:transparent;color:var(--p-color-primary);
    display:flex;flex-direction:column;min-height:100svh;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button,input{font:inherit;color:inherit}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--p-color-focus);outline-offset:3px;border-radius:var(--p-radius-sm)}
  ::selection{background:var(--p-color-frosted)}

  .backdrop::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,hsl(0 0% 100% / .42) 0%,hsl(0 0% 100% / .16) 38%,hsl(0 0% 100% / .34) 100%);
  }

  /* ===================== Liquid glass ===================== */
  .glass{position:relative;background:var(--glass-opaque);box-shadow:var(--p-shadow-lg)}
  @supports (backdrop-filter:blur(1px)){
    .glass{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
  }
  /* specular rim — the light catching the edge of the pane */
  .glass::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(145deg,
      hsl(0 0% 100% / .95) 0%, hsl(0 0% 100% / .35) 26%,
      hsl(0 0% 100% / .06) 52%, hsl(0 0% 100% / .3) 76%, hsl(0 0% 100% / .85) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  /* sheen rolling off the top-left corner */
  .glass::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(130% 80% at 6% -18%,hsl(0 0% 100% / .5),hsl(0 0% 100% / 0) 58%);
  }
  .panel,.foot,.result-head,ol.grid{position:relative;z-index:1}

  /* ===================== Topbar ===================== */
  .topbar{
    position:sticky;top:12px;z-index:40;
    width:max-content;max-width:calc(100% - 24px);margin:12px auto 0;
    display:flex;align-items:center;gap:14px;
    padding:9px 20px;border-radius:var(--p-radius-full);
  }
  .brand{font-size:var(--p-typescale-xs);font-weight:var(--p-font-weight-semibold)}
  .brand-meta{font-size:var(--p-typescale-xs);color:var(--p-color-contrast-medium)}

  /* ===================== Layout ===================== */
  .wrap{position:relative;z-index:1;flex:1 0 auto;width:100%;max-width:740px;margin:0 auto;padding:0 var(--p-spacing-fluid-md) var(--p-spacing-fluid-md)}

  .hero{text-align:center;padding:calc(var(--p-spacing-fluid-lg) * 2) 0 calc(var(--p-spacing-fluid-md) * 3)}
  h1{
    font-size:var(--p-typescale-3xl);font-weight:var(--p-font-weight-normal);line-height:1.06;
    hyphens:auto;overflow-wrap:break-word;
  }
  /* the omega stands on the baseline at cap height, trailing its own slipstream */
  .slipstream{height:.72em;margin-left:.2em}

  /* ===================== Cards ===================== */
  .card{border-radius:var(--p-radius-4xl);margin-top:var(--p-spacing-fluid-md);overflow:hidden}
  .panel{padding:var(--p-spacing-fluid-lg) var(--p-spacing-fluid-md)}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--p-spacing-static-md)}
  .panel-title{font-size:var(--p-typescale-lg);font-weight:var(--p-font-weight-normal)}
  .badge{
    font-size:var(--p-typescale-2xs);font-weight:var(--p-font-weight-semibold);color:var(--p-color-contrast-high);
    background:hsl(0 0% 100% / .5);border-radius:var(--p-radius-full);padding:6px 14px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* ===================== Chips ===================== */
  .chips{display:flex;flex-wrap:wrap;gap:var(--p-spacing-static-md);margin:var(--p-spacing-static-lg) 0 0}
  .chip{
    display:inline-flex;align-items:center;gap:8px;border-radius:var(--p-radius-full);
    background:hsl(0 0% 100% / .55);border:1px solid hsl(0 0% 100% / .7);padding:8px 10px 8px 18px;
    font-size:var(--p-typescale-xs);font-weight:var(--p-font-weight-semibold);
  }
  .chip.out{background:transparent;border-color:var(--p-color-contrast-lower)}
  .chip-name{
    border:0;background:none;cursor:pointer;padding:2px 0;border-radius:var(--p-radius-sm);
    font-weight:inherit;font-size:inherit;
  }
  .chip.out .chip-name{color:var(--p-color-contrast-low);text-decoration:line-through;text-decoration-thickness:1px}
  .chip-x{
    width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:var(--p-radius-full);
    background:transparent;color:var(--p-color-contrast-low);cursor:pointer;font-size:15px;line-height:1;
    transition:background var(--p-duration-sm) var(--p-ease-in-out),color var(--p-duration-sm) var(--p-ease-in-out);
  }
  .chip-x:hover{background:var(--p-color-frosted-soft);color:var(--p-color-primary)}
  .chip.enter{animation:pop var(--p-duration-sm) var(--ease-spring)}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

  .empty{
    margin-top:var(--p-spacing-static-md);padding:var(--p-spacing-static-lg) var(--p-spacing-static-md);text-align:center;
    border:1px dashed var(--p-color-contrast-lower);border-radius:var(--p-radius-lg);color:var(--p-color-contrast-medium);
    font-size:var(--p-typescale-xs);
  }

  /* ===================== Input ===================== */
  .field{display:flex;gap:var(--p-spacing-static-sm);margin-top:var(--p-spacing-static-lg)}
  input[type=text]{
    flex:1;min-width:0;background:hsl(0 0% 100% / .6);color:var(--p-color-primary);
    border:1px solid var(--p-color-contrast-lower);border-radius:var(--p-radius-full);
    padding:14px 20px;transition:border-color var(--p-duration-sm) var(--p-ease-in-out);
  }
  input[type=text]::placeholder{color:var(--p-color-contrast-low)}
  input[type=text]:hover{border-color:var(--p-color-contrast-medium)}
  input[type=text]:focus{border-color:var(--p-color-primary)}

  /* ===================== Buttons ===================== */
  .btn{
    border-radius:var(--p-radius-full);padding:14px 26px;line-height:1;cursor:pointer;
    font-weight:var(--p-font-weight-semibold);font-size:var(--p-typescale-xs);white-space:nowrap;
    border:1px solid var(--p-color-primary);background:transparent;color:var(--p-color-primary);
    transition:background var(--p-duration-sm) var(--p-ease-in-out),color var(--p-duration-sm) var(--p-ease-in-out),transform var(--p-duration-sm) var(--ease-spring),opacity var(--p-duration-sm) var(--p-ease-in-out);
  }
  .btn:hover:not(:disabled){background:var(--p-color-frosted)}
  .btn:active:not(:disabled){transform:scale(.97)}
  .btn-primary{background:var(--p-color-primary);color:var(--p-color-canvas)}
  .btn-primary:hover:not(:disabled){background:var(--p-color-primary);opacity:.82}
  .btn-quiet{border-color:transparent;color:var(--p-color-contrast-high)}
  .btn:disabled{border-color:transparent;background:var(--p-color-frosted);color:var(--p-color-contrast-low);cursor:not-allowed}

  .foot{
    border-top:1px solid var(--p-color-contrast-lower);padding:calc(var(--p-spacing-static-md) * 1.5) var(--p-spacing-fluid-md);
    display:flex;align-items:center;justify-content:space-between;gap:var(--p-spacing-static-md);flex-wrap:wrap;
  }
  .foot .actions{display:flex;gap:var(--p-spacing-static-sm);flex-wrap:wrap;margin-left:auto}

  /* ===================== Start lights ===================== */
  .stage{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:var(--p-color-backdrop);opacity:0;pointer-events:none;transition:opacity var(--p-duration-md) var(--p-ease-in-out);
  }
  @supports (backdrop-filter:blur(1px)){
    .stage{backdrop-filter:var(--p-blur-frosted) saturate(140%);-webkit-backdrop-filter:var(--p-blur-frosted) saturate(140%)}
  }
  .stage.on{opacity:1;pointer-events:auto}
  /* the light gantry: a glass capsule floating over the track */
  .housing{
    padding:clamp(18px,4vw,26px) clamp(22px,5vw,34px);border-radius:var(--p-radius-full);
    transform:scale(.94);transition:transform var(--p-duration-lg) var(--ease-spring);
  }
  .stage.on .housing{transform:scale(1)}
  .stage.go .housing{transform:scale(1.03)}
  .stage .housing{background:hsl(0 0% 100% / .5);backdrop-filter:none;-webkit-backdrop-filter:none}
  .lights{position:relative;z-index:1;display:flex;gap:clamp(12px,3vw,24px)}
  .led{
    width:clamp(34px,8vw,56px);aspect-ratio:1;border-radius:var(--p-radius-full);background:var(--led-off);
    box-shadow:inset 0 2px 6px hsl(0 0% 0% / .45);transition:background .09s,box-shadow .09s;
  }
  .led.on{
    background:var(--p-color-error);
    box-shadow:inset 0 1px 2px hsl(0 0% 100% / .45), 0 0 34px hsl(357 78% 45% / .6);
  }
  .led.go{
    background:var(--p-color-success);
    box-shadow:inset 0 1px 2px hsl(0 0% 100% / .45), 0 0 40px hsl(115 78% 40% / .7);
  }

  /* ===================== Starting grid ===================== */
  .result{display:none}
  .result.show{display:block}
  .result-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--p-spacing-static-md);
    padding:var(--p-spacing-fluid-md) var(--p-spacing-fluid-md) var(--p-spacing-static-md);
  }
  .result-date{font-size:var(--p-typescale-xs);color:var(--p-color-contrast-medium)}
  ol.grid{list-style:none}
  .row{
    display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:var(--p-spacing-static-md);
    padding:14px var(--p-spacing-fluid-md);border-top:1px solid var(--p-color-contrast-lower);
  }
  .row.anim{opacity:0;transform:translateY(10px);animation:reveal var(--p-duration-lg) var(--ease-spring) forwards}
  @keyframes reveal{to{opacity:1;transform:none}}
  .pos{
    font-size:var(--p-typescale-xl);line-height:1;color:var(--p-color-contrast-low);
    font-variant-numeric:tabular-nums;
  }
  .row:first-child .pos{color:var(--p-color-primary)}
  .name{font-size:var(--p-typescale-md)}
  .row:first-child .name{font-weight:var(--p-font-weight-semibold)}
  .pole{
    font-size:var(--p-typescale-2xs);font-weight:var(--p-font-weight-semibold);background:var(--p-color-primary);color:var(--p-color-canvas);
    border-radius:var(--p-radius-full);padding:4px 12px;
  }

  .legal{
    position:relative;z-index:1;flex:none;
    display:block;width:fit-content;max-width:calc(100% - 2 * var(--p-spacing-fluid-md));
    margin:var(--p-spacing-fluid-md) auto calc(14px + env(safe-area-inset-bottom, 0px));padding:7px 16px;
    border-radius:var(--p-radius-full);background:hsl(0 0% 100% / .5);border:1px solid hsl(0 0% 100% / .65);
    box-shadow:0 12px 26px -20px hsl(222 42% 16% / .6);
    text-align:center;font-size:var(--p-typescale-2xs);color:var(--p-color-contrast-high);
  }

  /* ===================== Toast ===================== */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:70;
    background:var(--p-color-primary);color:var(--p-color-canvas);border-radius:var(--p-radius-full);
    padding:10px 20px;font-size:var(--p-typescale-xs);font-weight:var(--p-font-weight-semibold);
    opacity:0;pointer-events:none;transition:opacity var(--p-duration-sm) var(--p-ease-in-out),transform var(--p-duration-md) var(--ease-spring);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:540px){
    .row{grid-template-columns:58px 1fr auto;gap:var(--p-spacing-static-sm)}
    .field{flex-direction:column}
    .field .btn{width:100%}
    .foot{flex-direction:column;align-items:stretch}
    .foot .actions{margin-left:0}
    .foot .actions .btn{flex:1}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
  @media print{
    .topbar,.field,.foot,.stage,.toast,.backdrop{display:none !important}
    .card{box-shadow:none;background:none}
    .card::before,.card::after{display:none}
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<header class="topbar glass">
  <span class="brand">Omega Daily</span>
  <span class="brand-meta">Starting grid</span>
</header>

<main class="wrap">
  <section class="hero">
    <h1 lang="de">Sportwagenschmiede<svg class="slipstream" viewBox="0 0 135 96" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true"><path opacity=".15" stroke-width="3.5" transform="translate(0,0)" d="M5.5 89.5 L17.5 89.5 C22.5 89.5 23.5 81.5 23.5 71.5 A38 38 0 1 1 75.5 71.5 C75.5 81.5 76.5 89.5 81.5 89.5 L93.5 89.5"/><path opacity=".28" stroke-width="5.5" transform="translate(12,0)" d="M5.5 89.5 L17.5 89.5 C22.5 89.5 23.5 81.5 23.5 71.5 A38 38 0 1 1 75.5 71.5 C75.5 81.5 76.5 89.5 81.5 89.5 L93.5 89.5"/><path opacity=".45" stroke-width="8" transform="translate(24,0)" d="M5.5 89.5 L17.5 89.5 C22.5 89.5 23.5 81.5 23.5 71.5 A38 38 0 1 1 75.5 71.5 C75.5 81.5 76.5 89.5 81.5 89.5 L93.5 89.5"/><path stroke-width="11" transform="translate(36,0)" d="M5.5 89.5 L17.5 89.5 C22.5 89.5 23.5 81.5 23.5 71.5 A38 38 0 1 1 75.5 71.5 C75.5 81.5 76.5 89.5 81.5 89.5 L93.5 89.5"/></svg></h1>
  </section>

  <section class="card glass" id="rosterCard">
    <div class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Who’s on the grid today?</h2>
        <span class="badge" id="count">9 of 9 racing</span>
      </div>
      <div class="chips" id="chips"></div>
      <p class="empty" id="empty" hidden>No names on the grid. Add at least two below.</p>

      <div class="field">
        <input type="text" id="nameInput" placeholder="Add a name — separate several with commas" autocomplete="off" spellcheck="false" aria-label="Add a name">
        <button type="button" class="btn" id="addBtn">Add</button>
      </div>
    </div>
    <div class="foot">
      <button type="button" class="btn btn-quiet" id="resetBtn">Reset team</button>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="goBtn">Draw the grid</button>
      </div>
    </div>
  </section>

  <section class="card result glass" id="resultCard" aria-live="polite">
    <div class="result-head">
      <h2 class="panel-title">Starting grid</h2>
      <span class="result-date" id="resultDate"></span>
    </div>
    <ol class="grid" id="grid"></ol>
    <div class="foot">
      <button type="button" class="btn btn-quiet" id="editBtn">Edit names</button>
      <div class="actions">
        <button type="button" class="btn" id="copyBtn">Copy</button>
        <button type="button" class="btn btn-primary" id="againBtn">Draw again</button>
      </div>
    </div>
  </section>

</main>

<footer class="legal">built in Porsche style — a private team tool, not affiliated with Porsche AG.</footer>

<div class="stage" id="stage" aria-hidden="true">
  <div class="housing glass">
    <div class="lights" id="lights">
      <span class="led"></span><span class="led"></span><span class="led"></span><span class="led"></span><span class="led"></span>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  /* ---- The regular line-up. Edit here when the team changes. ---- */
  var ROSTER = ['Pawel','Mariusz','Carlo','Steffen','Furkan','Tobi','Steve','Chris','Alex'];

  var $ = function(id){ return document.getElementById(id); };
  var chipsEl=$('chips'), countEl=$('count'), emptyEl=$('empty'), inputEl=$('nameInput'),
      goBtn=$('goBtn'), rosterCard=$('rosterCard'), resultCard=$('resultCard'),
      gridEl=$('grid'), dateEl=$('resultDate'), stage=$('stage'), toastEl=$('toast');
  var leds = Array.prototype.slice.call($('lights').children);

  var people = ROSTER.map(function(n){ return { name:n, racing:true }; });
  var fresh = [];   // names just added — animation only
  var order = [];
  var running = false;

  /* ---------------- Render the line-up ---------------- */
  function racers(){ return people.filter(function(p){ return p.racing; }); }

  function render(){
    chipsEl.innerHTML = '';
    people.forEach(function(p, i){
      var chip = document.createElement('span');
      chip.className = 'chip' + (p.racing ? '' : ' out') + (fresh.indexOf(p.name) > -1 ? ' enter' : '');

      var name = document.createElement('button');
      name.type = 'button';
      name.className = 'chip-name';
      name.textContent = p.name;
      name.setAttribute('aria-pressed', String(p.racing));
      name.title = p.racing ? 'Sit out today' : 'Put back on the grid';
      name.onclick = function(){ p.racing = !p.racing; fresh = []; render(); };

      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'chip-x';
      x.innerHTML = '&times;';
      x.setAttribute('aria-label', 'Remove ' + p.name);
      x.onclick = function(){ people.splice(i, 1); fresh = []; render(); };

      chip.appendChild(name);
      chip.appendChild(x);
      chipsEl.appendChild(chip);
    });
    fresh = [];

    var n = racers().length;
    countEl.textContent = n + ' of ' + people.length + ' racing';
    emptyEl.hidden = people.length > 0;
    goBtn.disabled = n < 2;
    goBtn.title = n < 2 ? 'Needs at least two names' : '';
  }

  function addNames(raw){
    raw.split(/[\n,;]+/).map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(n){
      var dupe = people.some(function(p){ return p.name.toLowerCase() === n.toLowerCase(); });
      if (!dupe) { people.push({ name:n, racing:true }); fresh.push(n); }
    });
    inputEl.value = '';
    render();
  }

  $('addBtn').onclick = function(){ addNames(inputEl.value); inputEl.focus(); };
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); addNames(inputEl.value); }
  });
  $('resetBtn').onclick = function(){
    people = ROSTER.map(function(n){ return { name:n, racing:true }; });
    fresh = ROSTER.slice();
    render();
    toast('Team reset');
  };

  /* ---------------- Draw ---------------- */
  function shuffle(list){
    var a = list.slice();
    var rnd = function(max){
      if (window.crypto && window.crypto.getRandomValues){
        var buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return buf[0] % max;
      }
      return Math.floor(Math.random() * max);
    };
    for (var i = a.length - 1; i > 0; i--){
      var j = rnd(i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showGrid(list, animate){
    order = list;
    gridEl.innerHTML = '';
    dateEl.textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'2-digit', month:'long' });

    list.forEach(function(name, i){
      var li = document.createElement('li');
      li.className = 'row' + (animate ? ' anim' : '');
      if (animate) li.style.animationDelay = (i * 65) + 'ms';

      var pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = 'P' + (i + 1);

      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = name;

      var tag = document.createElement('span');
      if (i === 0){ tag.className = 'pole'; tag.textContent = 'Pole'; }

      li.appendChild(pos); li.appendChild(nm); li.appendChild(tag);
      gridEl.appendChild(li);
    });

    rosterCard.style.display = 'none';
    resultCard.classList.add('show');
  }

  function run(){
    if (running) return;
    var list = racers().map(function(p){ return p.name; });
    if (list.length < 2) return;
    var result = shuffle(list);

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced){ showGrid(result, false); return; }

    running = true;
    rosterCard.style.display = 'none';
    resultCard.classList.remove('show');
    leds.forEach(function(l){ l.classList.remove('on', 'go'); });
    stage.classList.add('on');

    var STEP  = 300;   // gap between the red lights coming on
    var HOLD  = 450;   // all five red, then the pause
    var GREEN = 600;   // green stays on before the grid appears

    leds.forEach(function(led, i){
      setTimeout(function(){ led.classList.add('on'); }, STEP * (i + 1));
    });

    setTimeout(function(){
      leds.forEach(function(l){ l.classList.remove('on'); l.classList.add('go'); });   // green = go
      stage.classList.add('go');
      setTimeout(function(){
        stage.classList.remove('on', 'go');
        showGrid(result, true);
        running = false;
      }, GREEN);
    }, STEP * leds.length + HOLD);
  }

  goBtn.onclick = run;
  $('againBtn').onclick = run;
  $('editBtn').onclick = function(){
    resultCard.classList.remove('show');
    rosterCard.style.display = '';
  };

  /* ---------------- Copy ---------------- */
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1900);
  }

  $('copyBtn').onclick = function(){
    var text = 'Omega Daily — Starting grid, ' + dateEl.textContent + '\n' +
      order.map(function(n, i){ return 'P' + (i + 1) + '  ' + n + (i === 0 ? '  (Pole)' : ''); }).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copied'); },
                                              function(){ toast("Couldn't copy"); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); }
      catch(err){ toast("Couldn't copy"); }
      document.body.removeChild(ta);
    }
  };

  /* ---------------- Keyboard ---------------- */
  document.addEventListener('keydown', function(e){
    if (e.target === inputEl) return;
    if (e.key === 'r' && resultCard.classList.contains('show')){ e.preventDefault(); run(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !goBtn.disabled){ e.preventDefault(); run(); }
  });

  render();
})();
</script>
</body>
</html>
