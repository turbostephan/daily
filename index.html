<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omega Daily — Starting Grid</title>
<style>
  /* ===== Porsche Design System v4 — tokens (light-dark) ===== */
  :root{
    color-scheme: light dark;
    /* color */
    --canvas:        light-dark(#fff, hsl(225 66.7% 1.2%));
    --surface:       light-dark(hsl(240 10% 95%), hsl(240 2% 10%));
    --frosted:       light-dark(hsl(240 5% 70% / .148), hsl(240 2% 43% / .228));
    --frosted-soft:  light-dark(hsl(234 9.8% 60% / .06), hsl(240 3.7% 26.5% / .154));
    --primary:       light-dark(hsl(225 66.7% 1.2%), hsl(225 100% 99%));
    --contrast-high:   light-dark(hsl(240 7.1% 11% / .7), hsl(240 12.5% 96.9% / .67));
    --contrast-medium: light-dark(hsl(240 6.1% 7% / .6), hsl(240 12.5% 96.9% / .56));
    --contrast-low:    light-dark(hsl(240 5.3% 14.9% / .5), hsl(240 12.5% 96.9% / .45));
    --contrast-lower:  light-dark(hsl(234 6% 32.9% / .324), hsl(240 1.5% 61.8% / .302));
    --error:         light-dark(hsl(357 78% 41%), hsl(0 96.9% 62%));
    --success:       light-dark(hsl(115 77.5% 27.8%), hsl(157 84.9% 41.6%));
    --focus:         #1A44EA;
    --led-off:       light-dark(hsl(240 6% 80%), hsl(240 3% 26%));
    /* font */
    --font: 'Porsche Next','Arial Narrow',Arial,'Heiti SC',SimHei,sans-serif;
    --leading: calc(6px + 2.125ex);
    --w-normal:400; --w-semibold:600; --w-bold:700;
    --ts-2xs:.75rem; --ts-xs:.875rem; --ts-sm:1rem;
    --ts-md:clamp(1.13rem, 0.21vw + 1.08rem, 1.33rem);
    --ts-lg:clamp(1.27rem, 0.51vw + 1.16rem, 1.78rem);
    --ts-xl:clamp(1.42rem, 0.94vw + 1.23rem, 2.37rem);
    --ts-2xl:clamp(1.6rem, 1.56vw + 1.29rem, 3.16rem);
    --ts-3xl:clamp(1.8rem, 2.41vw + 1.32rem, 4.21rem);
    /* spacing */
    --sp-fluid-sm:clamp(8px, 0.5vw + 6px, 16px);
    --sp-fluid-md:clamp(16px, 1.25vw + 12px, 36px);
    --sp-fluid-lg:clamp(32px, 2.75vw + 23px, 76px);
    --sp-fluid-xl:clamp(48px, 3vw + 38px, 96px);
    --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:32px; --sp-xl:48px;
    /* border radius */
    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-full:calc(infinity * 1px);
    /* shadow */
    --shadow-sm:0px 3px 8px rgba(0,0,0,.16);
    --shadow-md:0px 4px 16px rgba(0,0,0,.16);
    --shadow-lg:0px 8px 40px rgba(0,0,0,.16);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--canvas)}
  body{
    font-family:var(--font);background:var(--canvas);color:var(--primary);
    line-height:var(--leading);min-height:100vh;-webkit-font-smoothing:antialiased;
    font-size:var(--ts-sm);font-weight:var(--w-normal);zoom:.8;
  }
  :focus{outline:none}
  :focus-visible{outline:var(--focus) solid 2px;outline-offset:2px;border-radius:var(--r-sm)}

  /* ===== Header ===== */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:var(--sp-md) var(--sp-fluid-md);
    border-bottom:1px solid var(--contrast-lower);
  }
  .wordmark{font-weight:var(--w-bold);font-size:var(--ts-sm)}
  .topbar .meta{font-size:var(--ts-xs);color:var(--contrast-medium)}

  .wrap{max-width:720px;margin:0 auto;padding:0 var(--sp-fluid-md) var(--sp-fluid-xl)}

  /* ===== Hero ===== */
  .hero{text-align:center;padding:var(--sp-fluid-lg) 0 0}
  .omega{
    font-family:var(--font);font-weight:var(--w-bold);color:var(--primary);
    font-size:clamp(88px,16vw,148px);line-height:.9;margin:0 auto var(--sp-fluid-md);text-align:center;
  }
  h1{
    font-size:var(--ts-3xl);font-weight:var(--w-semibold);line-height:1.05;
    margin:0;hyphens:auto;overflow-wrap:break-word;
  }

  /* ===== Start lights ===== */
  .lights{display:none;justify-content:center;gap:var(--sp-md);margin:var(--sp-fluid-md) 0 0}
  .lights.show{display:flex}
  .led{
    width:32px;height:32px;border-radius:var(--r-full);background:var(--led-off);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.4);transition:background .07s,box-shadow .07s;
  }
  .led.on{background:var(--error);box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 0 20px hsl(357 78% 41% / .55)}
  .led.go{background:var(--success);box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 0 22px hsl(140 80% 40% / .6)}

  /* ===== Surface card ===== */
  .card{background:var(--surface);border-radius:var(--r-lg);margin-top:var(--sp-fluid-md);overflow:hidden}
  .panel{padding:var(--sp-fluid-md)}
  .panel-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-md);margin-bottom:var(--sp-md)}
  .panel-title{font-size:var(--ts-lg);font-weight:var(--w-semibold)}
  .count{font-size:var(--ts-xs);color:var(--contrast-medium)}

  /* ===== Input (Input Text) ===== */
  .field{display:flex;gap:var(--sp-sm)}
  input[type=text]{
    flex:1;font-family:inherit;font-size:var(--ts-sm);font-weight:var(--w-normal);color:var(--primary);
    background:var(--canvas);border:2px solid var(--contrast-medium);border-radius:var(--r-sm);
    padding:12px 14px;outline:none;transition:border-color .15s;
  }
  input[type=text]::placeholder{color:var(--contrast-medium)}
  input[type=text]:hover{border-color:var(--contrast-high)}
  input[type=text]:focus-visible{border-color:var(--primary);outline:var(--focus) solid 2px;outline-offset:2px}

  /* ===== Buttons (pill) ===== */
  .btn{
    font-family:inherit;font-size:var(--ts-sm);font-weight:var(--w-semibold);line-height:1;
    border-radius:var(--r-full);padding:13px 24px;cursor:pointer;border:2px solid var(--primary);
    transition:background .15s,color .15s,filter .15s;white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:var(--canvas)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.35)}
  .btn-secondary{background:transparent;color:var(--primary)}
  .btn-secondary:hover:not(:disabled){background:var(--frosted)}
  .btn:disabled{border-color:var(--contrast-lower);background:var(--contrast-lower);color:var(--contrast-medium);cursor:not-allowed}

  /* ===== Tags / chips (Tag Dismissible) ===== */
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-sm);margin-top:var(--sp-md)}
  .chip{
    display:inline-flex;align-items:center;gap:var(--sp-sm);background:var(--frosted);
    border-radius:var(--r-full);padding:7px 8px 7px 14px;font-size:var(--ts-xs);
    font-weight:var(--w-semibold);color:var(--primary);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .chip button{
    width:20px;height:20px;border:none;border-radius:var(--r-full);cursor:pointer;background:transparent;
    color:var(--contrast-high);font-size:16px;line-height:1;display:grid;place-items:center;transition:background .15s;
  }
  .chip button:hover{background:var(--frosted-soft)}
  .empty-hint{color:var(--contrast-medium);font-size:var(--ts-xs);margin-top:var(--sp-md)}

  .panel-foot{
    border-top:1px solid var(--contrast-lower);padding:var(--sp-md) var(--sp-fluid-md);
    display:flex;justify-content:space-between;align-items:center;gap:var(--sp-md);flex-wrap:wrap;
  }
  .foot-hint{font-size:var(--ts-xs);color:var(--contrast-medium)}
  .foot-actions{display:flex;gap:var(--sp-sm);flex-wrap:wrap}

  /* ===== Result grid ===== */
  .result{display:none}
  .result.show{display:block}
  .result-head{
    display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-md);
    padding:var(--sp-fluid-md) var(--sp-fluid-md) var(--sp-md);border-bottom:1px solid var(--contrast-lower);
  }
  .result-title{font-size:var(--ts-lg);font-weight:var(--w-semibold)}
  .result-date{font-size:var(--ts-xs);color:var(--contrast-medium)}
  .grid{list-style:none}
  .row{
    display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:var(--sp-md);
    padding:var(--sp-md) var(--sp-fluid-md);border-bottom:1px solid var(--contrast-lower);
    opacity:0;transform:translateY(8px);animation:reveal .42s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes reveal{to{opacity:1;transform:none}}
  .row:last-child{border-bottom:none}
  .pos{font-size:var(--ts-xl);font-weight:var(--w-bold);color:var(--primary);line-height:1}
  .name{font-size:var(--ts-md);font-weight:var(--w-semibold)}
  .tag{
    font-size:var(--ts-2xs);font-weight:var(--w-semibold);color:var(--canvas);background:var(--primary);
    border-radius:var(--r-full);padding:4px 12px;
  }
  .result-foot{padding:var(--sp-md) var(--sp-fluid-md);display:flex;gap:var(--sp-sm);justify-content:flex-end;flex-wrap:wrap}

  footer{text-align:center;margin-top:var(--sp-fluid-md);font-size:var(--ts-2xs);color:var(--contrast-medium)}

  @media (max-width:520px){
    .field{flex-direction:column}
    .row{grid-template-columns:56px 1fr auto}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition:none !important}}
</style>
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Omega&nbsp;Daily</span>
    <span class="meta">Standup Order</span>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="omega" aria-hidden="true">Ω</div>
      <h1 lang="de">Sportwagenschmiede</h1>
    </section>

    <div class="lights" id="lights" aria-hidden="true">
      <span class="led"></span><span class="led"></span><span class="led"></span><span class="led"></span><span class="led"></span>
    </div>

    <section class="card" id="inputCard">
      <div class="panel">
        <div class="panel-top">
          <span class="panel-title">Who's in today?</span>
          <span class="count" id="count">0 names</span>
        </div>
        <div class="field">
          <input type="text" id="nameInput" placeholder="Add a name, then press Enter" autocomplete="off" spellcheck="false">
          <button class="btn btn-secondary" id="addBtn">Add</button>
        </div>
        <div class="chips" id="chips"></div>
        <p class="empty-hint" id="emptyHint">No names yet. Add them one by one — or paste a whole list at once.</p>
      </div>
      <div class="panel-foot">
        <span class="foot-hint">Add at least 2 names to build a grid.</span>
        <div class="foot-actions">
          <button class="btn btn-secondary" id="quickShuffle" hidden>Shuffle again</button>
          <button class="btn btn-primary" id="goBtn" disabled>Generate order</button>
        </div>
      </div>
    </section>

    <section class="card result" id="resultCard">
      <div class="result-head">
        <span class="result-title">Starting grid</span>
        <span class="result-date" id="resultDate"></span>
      </div>
      <ol class="grid" id="grid"></ol>
      <div class="result-foot">
        <button class="btn btn-secondary" id="editBtn">Edit names</button>
        <button class="btn btn-primary" id="reshuffleBtn">Shuffle again</button>
      </div>
    </section>

    <footer>Built in Porsche style — original crest, not affiliated with Porsche AG.</footer>
  </div>

<script>
  // ---- Optionally hard-code your team here, e.g. ["Anna","Ben","Carla"] ----
  let names = [];

  const $ = id => document.getElementById(id);
  const nameInput=$('nameInput'),addBtn=$('addBtn'),chips=$('chips'),count=$('count'),
        emptyHint=$('emptyHint'),goBtn=$('goBtn'),inputCard=$('inputCard'),
        lights=$('lights'),resultCard=$('resultCard'),grid=$('grid'),resultDate=$('resultDate');
  const leds=[...lights.querySelectorAll('.led')];

  function render(){
    chips.innerHTML='';
    names.forEach((n,i)=>{
      const chip=document.createElement('span');chip.className='chip';
      chip.innerHTML='<span></span><button aria-label="Remove">&times;</button>';
      chip.querySelector('span').textContent=n;
      chip.querySelector('button').onclick=()=>{names.splice(i,1);render();};
      chips.appendChild(chip);
    });
    count.textContent=names.length+(names.length===1?' name':' names');
    emptyHint.style.display=names.length?'none':'block';
    goBtn.disabled=names.length<2;
  }
  function addNames(raw){
    raw.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
      if(!names.some(x=>x.toLowerCase()===n.toLowerCase())) names.push(n);
    });
    nameInput.value='';render();
  }
  addBtn.onclick=()=>addNames(nameInput.value);
  nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addNames(nameInput.value);}});
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function showGrid(order){
    grid.innerHTML='';
    resultDate.textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long'});
    order.forEach((n,i)=>{
      const li=document.createElement('li');li.className='row'+(i===0?' pole':'');
      li.style.animationDelay=(i*70)+'ms';
      li.innerHTML='<span class="pos">P'+(i+1)+'</span><span class="name"></span>'+(i===0?'<span class="tag">Pole</span>':'<span></span>');
      li.querySelector('.name').textContent=n;grid.appendChild(li);
    });
    inputCard.style.display='none';resultCard.classList.add('show');
    $('quickShuffle').hidden=false;
  }
  function run(){
    const order=shuffle(names);
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){showGrid(order);return;}
    resultCard.classList.remove('show');inputCard.style.display='none';
    lights.classList.add('show');leds.forEach(l=>l.classList.remove('on','go'));
    leds.forEach((led,i)=>setTimeout(()=>led.classList.add('on'),260*(i+1)));
    const redsDone=260*5+520;
    setTimeout(()=>{leds.forEach(l=>{l.classList.remove('on');l.classList.add('go');});},redsDone); // green = go
    setTimeout(()=>{
      lights.classList.remove('show');leds.forEach(l=>l.classList.remove('go'));showGrid(order);
    },redsDone+700);
  }
  goBtn.onclick=run;$('reshuffleBtn').onclick=run;$('quickShuffle').onclick=run;
  $('editBtn').onclick=()=>{resultCard.classList.remove('show');inputCard.style.display='';};
  render();
</script>
</body>
</html>
